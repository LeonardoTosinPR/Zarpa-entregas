<html lang="pt-br"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zarpa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/css/login.css">
</head>
<body class="auth-screen d-flex align-items-center justify-content-center py-4">
    <div class="auth-background" aria-hidden="true">
        <div class="route-line one"></div>
        <div class="route-line two"></div>
        <div class="floating-pin first"></div>
        <div class="floating-pin second"></div>
        <div class="auth-road"></div>
    </div>

    <main class="auth-wrap">
        <div class="card auth-card">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <img class="brand-mobilete mb-2" src="/assets/images/mobilete.svg" alt="Mobilete Zarpa">
                    <div class="auth-kicker fw-semibold">Entregas urbanas</div>
                    <h1 class="auth-title fw-bold mt-1 mb-1">Zarpa</h1>
                    <p class="text-muted small mb-0">Rotas rapidas para clientes e entregadores.</p>
                </div>

                                    <div class="alert alert-danger alert-dismissible py-2" role="alert">
                        Você precisa estar logado para acessar esta página.                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                    </div>
                
                <h2 class="h5 text-center mb-3">Entrar</h2>

<form action="/login" method="POST" data-validate-form="" novalidate="">
    <div class="mb-3">
        <label class="form-label">E-mail ou CPF</label>
        <input type="text" name="user[identifier]" class="form-control" placeholder="seu@email.com ou 000.000.000-00" required="" autofocus="">
    </div>

    <div class="mb-4">
        <label class="form-label" for="login-password">Senha</label>
        <input id="login-password" type="password" name="user[password]" class="form-control" placeholder="Sua senha" autocomplete="current-password" minlength="6" required="">
        <div class="invalid-feedback">Informe sua senha.</div>
    </div>

    <div class="d-grid mb-3">
        <button type="submit" class="btn btn-zarpa fw-bold">
            <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
        </button>
    </div>

    <p class="text-center text-muted small mb-0">
        Nao tem conta? <a href="/register">Cadastre-se</a>
    </p>
</form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="/assets/js/application.js"></script>


</body></html>
